name: CI

on:
  pull_request:
    branches:
      - master
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  configurations:
    name: GCC configuration matrix
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure
        run: cmake -S tests -B build -DTEST_ALL_OPTIONS=1 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

  sanitizers:
    name: Clang ASan and UBSan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure
        env:
          CC: clang
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -S tests -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  msvc:
    name: MSVC
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure
        run: cmake -S tests -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  static-analysis:
    name: Cppcheck 2.13.0
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cppcheck=2.13.0-2ubuntu3
          cppcheck --version

      - name: Configure
        run: cmake -S tests -B build -DUAES_ENABLE_CPPCHECK=ON -DCMAKE_BUILD_TYPE=Release

      - name: Analyze
        run: cmake --build build --target cppcheck
